server {
    listen 80;
    listen 443 ssl;
    ssl_certificate /etc/ssl/depends/feiwenchao.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/depends/feiwenchao.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name kid.feiwenchao.com;

    location / {
        proxy_pass http://kid-sprout-web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
